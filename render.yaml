services:
  - type: web
    name: slide-study-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 8
    # Render restarts/replaces an instance that stops answering this, instead of
    # leaving the site on 502. Keep it cheap (no DB/network) — see /healthz in app.py.
    healthCheckPath: /healthz
    envVars:
      # AI
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TPM_LIMIT
        value: "200000"

      # Auth & Database (Supabase)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Payments (Stripe)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false

      # App
      - key: APP_URL
        value: https://alimne.app
      - key: ADMIN_TOKEN
        generateValue: true
